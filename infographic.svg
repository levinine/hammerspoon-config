<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14172b"/>
      <stop offset="1" stop-color="#1f2347"/>
    </linearGradient>
    <style>
      .card { fill: #262b52; stroke-width: 2; }
      .h { fill: #fff; font-size: 22px; font-weight: 700; }
      .t { fill: #c9cff5; font-size: 15px; }
      .k { fill: #ffd166; font-size: 15px; font-weight: 700; font-family: Menlo, monospace; }
      .sub { fill: #8f97d6; font-size: 14px; }
    </style>
  </defs>

  <rect width="1200" height="1000" fill="url(#bg)"/>

  <text x="600" y="62" text-anchor="middle" fill="#fff" font-size="40" font-weight="800">🔨 My Hammerspoon Setup</text>
  <text x="600" y="92" text-anchor="middle" class="sub">Everything runs from one key: Caps Lock → ⌘⌃⌥⇧ (Hyper, via Karabiner-Elements)</text>

  <!-- HYPER hub -->
  <rect x="470" y="115" width="260" height="56" rx="28" fill="#ffd166"/>
  <text x="600" y="151" text-anchor="middle" fill="#14172b" font-size="22" font-weight="800">⇪ HYPER + key</text>

  <!-- Card 1: App launcher -->
  <rect class="card" x="40" y="200" width="350" height="250" rx="16" stroke="#4cc9f0"/>
  <text x="60" y="236" class="h">🚀 App Launcher</text>
  <text x="60" y="260" class="sub">Focus the app, or open it if closed</text>
  <text x="60" y="292" class="k">A</text><text x="85" y="292" class="t">iTerm</text>
  <text x="200" y="292" class="k">C</text><text x="225" y="292" class="t">VS Code</text>
  <text x="60" y="318" class="k">I</text><text x="85" y="318" class="t">IntelliJ</text>
  <text x="200" y="318" class="k">G</text><text x="225" y="318" class="t">Chrome</text>
  <text x="60" y="344" class="k">F</text><text x="85" y="344" class="t">Edge</text>
  <text x="200" y="344" class="k">E</text><text x="225" y="344" class="t">Outlook</text>
  <text x="60" y="370" class="k">T</text><text x="85" y="370" class="t">Teams</text>
  <text x="200" y="370" class="k">S</text><text x="225" y="370" class="t">Slack</text>
  <text x="60" y="396" class="k">B</text><text x="85" y="396" class="t">Bruno</text>
  <text x="200" y="396" class="k">P</text><text x="225" y="396" class="t">Postman</text>
  <text x="60" y="422" class="k">R</text><text x="85" y="422" class="t">MacPass</text>
  <text x="200" y="422" class="k">V/D/H</text><text x="255" y="422" class="t">Viber/Deezer/HS</text>

  <!-- Card 2: Window management -->
  <rect class="card" x="425" y="200" width="350" height="250" rx="16" stroke="#80ed99"/>
  <text x="445" y="236" class="h">🪟 Window Management</text>
  <text x="445" y="260" class="sub">Tiling without the mouse</text>
  <text x="445" y="292" class="k">← / →</text><text x="510" y="292" class="t">Snap to 50% left / right</text>
  <text x="445" y="318" class="k">↑</text><text x="510" y="318" class="t">Toggle full screen</text>
  <text x="445" y="344" class="k">↓</text><text x="510" y="344" class="t">Center middle third</text>
  <text x="445" y="370" class="k">1 / 2</text><text x="510" y="370" class="t">Send window to display 2 / 1</text>
  <text x="445" y="396" class="k">M</text><text x="510" y="396" class="t">Split-screen with another window</text>
  <text x="445" y="422" class="k">X</text><text x="510" y="422" class="t">Mouse to nearest window edge</text>

  <!-- Card 3: Developer mode -->
  <rect class="card" x="810" y="200" width="350" height="250" rx="16" stroke="#ff9f1c"/>
  <text x="830" y="236" class="h">🧑‍💻 Developer Mode</text>
  <text x="830" y="260" class="sub">HYPER+D, then a key (acts on iTerm's repo)</text>
  <text x="830" y="292" class="k">S</text><text x="860" y="292" class="t">git status</text>
  <text x="830" y="318" class="k">P</text><text x="860" y="318" class="t">git pull</text>
  <text x="830" y="344" class="k">L</text><text x="860" y="344" class="t">Last 10 commits</text>
  <text x="830" y="370" class="k">C</text><text x="860" y="370" class="t">Copy branch name</text>
  <text x="830" y="396" class="k">H</text><text x="860" y="396" class="t">Copy last commit hash</text>
  <text x="830" y="422" class="k">J</text><text x="860" y="422" class="t">Pretty-print JSON in clipboard</text>

  <!-- Card 4: Web mode -->
  <rect class="card" x="40" y="480" width="350" height="215" rx="16" stroke="#c77dff"/>
  <text x="60" y="516" class="h">🌐 Web Mode</text>
  <text x="60" y="540" class="sub">HYPER+W, then a key</text>
  <text x="60" y="572" class="k">B</text><text x="90" y="572" class="t">Azure DevOps board</text>
  <text x="60" y="598" class="k">R</text><text x="90" y="598" class="t">Pull requests</text>
  <text x="60" y="624" class="k">A</text><text x="90" y="624" class="t">DevOps home</text>
  <text x="215" y="624" class="k">C</text><text x="240" y="624" class="t">Confluence</text>
  <text x="60" y="650" class="k">E</text><text x="90" y="650" class="t">Copy current Edge URL</text>
  <text x="60" y="676" class="k">T</text><text x="90" y="676" class="t">Copy work-item / ticket number</text>

  <!-- Card 5: Text & capture -->
  <rect class="card" x="425" y="480" width="350" height="215" rx="16" stroke="#f72585"/>
  <text x="445" y="516" class="h">✂️ Capture &amp; Text</text>
  <text x="445" y="540" class="sub">Get text out of anything</text>
  <text x="445" y="572" class="k">O</text><text x="475" y="572" class="t">Screenshot region → OCR → clipboard</text>
  <text x="445" y="598" class="t" font-size="13" fill="#8f97d6">   (macOS Vision, via ocr.js)</text>
  <text x="445" y="630" class="k">Z</text><text x="475" y="630" class="t">Translate selection → English popup</text>
  <text x="445" y="662" class="k">4/5/6</text><text x="500" y="662" class="t">Keyboard layout (Hex/SR Latin/SR)</text>

  <!-- Card 6: Everyday helpers -->
  <rect class="card" x="810" y="480" width="350" height="215" rx="16" stroke="#4895ef"/>
  <text x="830" y="516" class="h">⏰ Everyday Helpers</text>
  <text x="830" y="540" class="sub">Small things that save clicks</text>
  <text x="830" y="572" class="k">R</text><text x="860" y="572" class="t">Reminder: "10 call mom", "1h30 standup"</text>
  <text x="830" y="604" class="k">Space</text><text x="885" y="604" class="t">Teams push-to-talk mute toggle</text>
  <text x="830" y="636" class="k">⌘Q</text><text x="870" y="636" class="t">Hold to quit (no accidents)</text>
  <text x="830" y="668" class="k">0</text><text x="860" y="668" class="t">Reload Hammerspoon config</text>

  <!-- Optional modules -->
  <rect class="card" x="40" y="725" width="1120" height="125" rx="16" stroke="#8f97d6" stroke-dasharray="6 6"/>
  <text x="60" y="761" class="h">🧩 Ready to enable (commented out in init.lua)</text>
  <text x="60" y="792" class="t">🔒 VPN connect (Tunnelblick + Keychain)  •  🔊 Audio output toggler  •  📶 Wi-Fi / LAN menubar toggler  •  🖱️ Mouse finder</text>
  <text x="60" y="820" class="t">🔠 Upper / lower-case selection  •  ⌨️ Keypress show (Keycastr-style)  •  🟦 Rounded screen corners  •  🔑 JWT paster</text>

  <!-- Under the hood -->
  <rect x="40" y="880" width="1120" height="90" rx="16" fill="#0e1124"/>
  <text x="60" y="913" class="h" font-size="18">⚙️ Under the hood</text>
  <text x="60" y="942" class="t">Lua modules loaded from init.lua  •  Spoons auto-installed via SpoonInstall  •  Secrets from macOS Keychain  •  Modal keys auto-exit after 3 s</text>
  <text x="1140" y="913" text-anchor="end" class="sub">levinine/hammerspoon-config</text>
</svg>
